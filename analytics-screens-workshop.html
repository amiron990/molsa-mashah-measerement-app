<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מדאטה להחלטה — כלי לימוד מסכים אנליטיים | Know Your Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Assistant:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* KYD brand tokens */
    --navy:#0A0E27;
    --navy-2:#141832;
    --teal:#00D4B4;
    --teal-mid:#00A896;
    --teal-soft:#E0FBF7;
    --violet:#7C3AED;
    --violet-soft:#EDE9FE;
    --accent:#00D4B4;
    --bg:#F8F9FA;
    --panel:#FFFFFF;
    --line:#E9ECEF;
    --text:#1A1A2E;
    --muted:#6B7280;
    --chip:#F1F3F5;
    --chip-on:#00D4B4;
    --shadow:0 2px 14px rgba(10,14,39,.07);
    --font-head:'Heebo','Assistant',sans-serif;
    --font-body:'Assistant','Heebo',Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }

  /* ===== Header ===== */
  header.app{
    background:var(--panel);
    color:var(--text);
    padding:10px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    flex:0 0 auto;
    border-bottom:1px solid var(--line);
  }
  header.app .brand{display:flex;align-items:center;gap:16px;}
  header.app .brand .kyd-mark{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
  header.app .brand .kyd-icon{width:30px;height:30px;flex:0 0 auto;display:block;}
  header.app .brand .kyd-word{
    font-family:'Space Grotesk','Heebo',sans-serif;font-weight:700;
    font-size:17px;letter-spacing:1.5px;color:#1A1A2E;white-space:nowrap;line-height:1;
  }
  header.app .brand .divider{width:1px;height:30px;background:var(--line);flex:0 0 auto;}
  header.app .brand .titles{display:flex;flex-direction:column;line-height:1.18;}
  header.app .brand .t1{font-family:var(--font-head);font-size:15px;font-weight:700;color:var(--navy);}
  header.app .brand .t2{font-size:11.5px;color:var(--muted);}
  header.app .actions{display:flex;align-items:center;gap:10px;}
  .btn{
    border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;
    cursor:pointer;font-family:var(--font-head);transition:.15s;letter-spacing:.01em;
  }
  .btn-pdf{background:var(--teal);color:var(--navy);}
  .btn-pdf:hover{background:var(--teal-mid);}
  .btn-reset{background:transparent;color:var(--muted);border:1.5px solid var(--line);}
  .btn-reset:hover{border-color:var(--navy);color:var(--navy);}

  /* ===== Tool tabs ===== */
  nav.tools{
    flex:0 0 auto;
    display:flex;
    gap:8px;
    padding:10px 18px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    overflow-x:auto;
  }
  nav.tools button{
    flex:1 1 0;
    min-width:140px;
    text-align:right;
    border:1px solid var(--line);
    background:#fbfcfd;
    border-radius:9px;
    padding:9px 12px;
    cursor:pointer;
    font-family:inherit;
    transition:.15s;
    position:relative;
  }
  nav.tools button .nm{display:block;font-family:var(--font-head);font-size:14px;font-weight:700;color:var(--navy);}
  nav.tools button .sb{display:block;font-size:11px;color:var(--muted);margin-top:2px;}
  nav.tools button .cr{
    display:inline-block;font-size:10.5px;font-weight:700;color:var(--violet);
    background:var(--violet-soft);border-radius:5px;padding:2px 7px;margin-top:5px;
    direction:ltr;unicode-bidi:isolate;
  }
  nav.tools button .crn{
    display:block;font-size:10px;font-weight:700;color:var(--violet);margin-top:3px;
  }
  nav.tools button:hover{border-color:var(--teal);}
  nav.tools button.active{
    background:var(--teal-soft);
    border-color:var(--teal);
    box-shadow:inset 0 -3px 0 var(--teal);
  }
  nav.tools button .dot{
    position:absolute;top:6px;left:6px;width:18px;height:18px;border-radius:50%;
    background:var(--teal);color:var(--navy);display:none;
    align-items:center;justify-content:center;font-size:12px;font-weight:800;line-height:1;
    box-shadow:0 1px 3px rgba(10,14,39,.2);
  }
  nav.tools button.answered .dot{display:flex;}
  nav.tools button.answered{border-color:var(--teal);}

  /* ===== Main ===== */
  main{
    flex:1 1 auto;
    display:flex;
    gap:14px;
    padding:14px 18px;
    overflow:hidden;
  }
  /* dashboard pane (RTL: appears on the right, 2/3) */
  .dash{
    flex:2 1 0;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    min-width:0;
  }
  .dash .dash-head{
    padding:10px 16px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  }
  .dash .dash-head .title{font-family:var(--font-head);font-size:15px;font-weight:700;color:var(--navy);}
  .dash .dash-head .src{font-size:12px;color:var(--muted);}
  .dash .dash-head .creds{
    font-size:11.5px;color:var(--navy);background:var(--teal-soft);
    border:1px solid var(--teal);border-radius:7px;padding:3px 10px;
    display:none;align-items:center;gap:7px;
  }
  .dash .dash-head .creds.show{display:inline-flex;}
  .dash .dash-head .creds b{font-weight:700;}
  .dash .dash-head .creds code{
    font-family:'Space Grotesk',monospace;background:#fff;border:1px solid var(--line);
    border-radius:4px;padding:1px 6px;font-size:11.5px;color:var(--text);
    -webkit-user-select:all;user-select:all;
  }
  .dash .dash-head .creds .crnote{font-weight:700;color:var(--violet);}
  .dash .frame-wrap{flex:1 1 auto;position:relative;background:#f0f3f6;min-height:0;}
  .dash iframe{width:100%;height:100%;border:0;display:block;}
  .dash .frame-fallback{
    position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center;color:var(--muted);
  }

  /* questions pane (RTL: appears on the left, 1/3) */
  .qpanel{
    flex:1 1 0;
    background:#E8ECF1;
    border:1px solid #D5DBE3;
    border-radius:12px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    min-width:300px;
    max-width:430px;
    overflow:hidden;
  }
  .qpanel .qhead{
    padding:12px 16px;border-bottom:1px solid #D5DBE3;background:#DFE5EC;
    display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;transition:background .12s;
  }
  .qpanel .qhead:hover{background:#D3DAE3;}
  .qpanel .qhead .h{font-family:var(--font-head);font-size:15px;font-weight:700;color:var(--navy);}
  .qpanel .qhead .prog{font-size:12px;color:var(--muted);margin-right:auto;}
  .qbody{flex:1 1 auto;overflow-y:auto;padding:6px 16px 18px;}

  /* collapsible questions panel */
  .qpanel .qhead .qtoggle{
    border:none;background:transparent;cursor:pointer;font-size:16px;color:var(--muted);
    padding:2px 7px;border-radius:6px;line-height:1;font-family:inherit;flex:0 0 auto;
  }
  .qpanel .qhead .qtoggle:hover{background:#cfd6df;color:var(--navy);}
  .qpanel.collapsed{flex:0 0 auto;min-width:0;width:48px;max-width:48px;}
  .qpanel.collapsed .qbody{display:none;}
  .qpanel.collapsed .qhead{flex-direction:column;gap:12px;padding:12px 4px;justify-content:flex-start;cursor:pointer;}
  .qpanel.collapsed .qhead .h{writing-mode:vertical-rl;white-space:nowrap;}
  .qpanel.collapsed .qhead .prog{display:none;}

  .q{padding:14px 0;border-bottom:1px dashed #C7CFD9;}
  .q:last-child{border-bottom:none;}
  .q .ql{font-family:var(--font-head);font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px;}
  .q .qhint{font-size:11px;color:var(--muted);margin-bottom:9px;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    border:1px solid #CBD3DD;
    background:#FFFFFF;
    color:var(--text);
    border-radius:18px;
    padding:6px 13px;
    font-size:12.5px;
    cursor:pointer;
    font-family:inherit;
    transition:.12s;
    user-select:none;
  }
  .chip:hover{border-color:var(--teal);}
  .chip.on{background:var(--chip-on);border-color:var(--chip-on);color:var(--navy);font-weight:700;}
  textarea,input.other-in{
    width:100%;border:1px solid #CBD3DD;border-radius:8px;
    padding:8px 10px;font-size:13px;font-family:inherit;resize:vertical;color:var(--text);
    margin-top:8px;background:#FFFFFF;
  }
  textarea{min-height:54px;}
  textarea:focus,input.other-in:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,212,180,.12);}
  .other-in{display:none;}
  .other-in.show{display:block;}

  /* ===== Print summary (PDF) ===== */
  .print-only{display:none;}
  @media print{
    body{height:auto;overflow:visible;display:block;}
    header.app,nav.tools,main{display:none !important;}
    .print-only{display:block;padding:0 8px;}
    .p-cover{margin-bottom:18px;border-bottom:3px solid var(--teal);padding-bottom:12px;}
    .p-cover .p-logo{margin-bottom:12px;}
    .p-cover h1{font-family:var(--font-head);font-size:20px;color:var(--navy);margin:0 0 4px;}
    .p-cover .meta{font-size:13px;color:#333;}
    .p-tool{break-inside:avoid;page-break-inside:avoid;margin:0 0 16px;border:1px solid #ccc;border-radius:8px;padding:12px 14px;}
    .p-tool h2{font-family:var(--font-head);font-size:15px;color:var(--navy);margin:0 0 2px;}
    .p-tool .p-src{font-size:11px;color:#666;margin-bottom:8px;}
    .p-qa{margin:6px 0;font-size:12.5px;}
    .p-qa .pq{font-weight:700;color:#222;}
    .p-qa .pa{color:#333;}
    .p-qa .pa.empty{color:#999;font-style:italic;}
    @page{margin:14mm;}
  }
</style>
</head>
<body>

<header class="app">
  <div class="brand">
    <span class="kyd-mark">
      <svg class="kyd-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38" role="img" aria-label="Know Your Data">
        <rect x="0" y="0" width="17.5" height="17.5" rx="3" fill="#00D4B4"></rect>
        <rect x="20.5" y="0" width="17.5" height="11.4" rx="3" fill="#00D4B4" opacity="0.5"></rect>
        <rect x="0" y="20.5" width="17.5" height="17.5" rx="3" fill="#00D4B4" opacity="0.35"></rect>
        <rect x="20.5" y="20.5" width="17.5" height="17.5" rx="3" fill="#7C3AED"></rect>
      </svg>
      <span class="kyd-word">KNOW YOUR DATA</span>
    </span>
    <span class="divider"></span>
    <span class="titles">
      <span class="t1">מדאטה להחלטה — כלי לימוד מסכים אנליטיים</span>
      <span class="t2">סדנת אפיון מערכות אנליטיות במגזר הציבורי</span>
    </span>
  </div>
  <div class="actions">
    <button class="btn btn-pdf" id="exportBtn">ייצוא ל‑PDF</button>
    <button class="btn btn-reset" id="resetBtn">איפוס</button>
  </div>
</header>

<nav class="tools" id="toolNav"></nav>

<main>
  <section class="dash">
    <div class="dash-head">
      <span class="title" id="dashTitle"></span>
      <span class="src" id="dashSrc"></span>
      <span class="creds" id="dashCreds"></span>
    </div>
    <div class="frame-wrap">
      <iframe id="dashFrame" title="dashboard" referrerpolicy="no-referrer-when-downgrade"></iframe>
      <div class="frame-fallback" id="dashFallback">
        <strong>לא ניתן להציג את הכלי כאן.</strong>
        <span>ייתכן שהאתר חוסם הטמעה. נסה/י לרענן את הדף.</span>
      </div>
    </div>
  </section>

  <aside class="qpanel">
    <div class="qhead">
      <button class="qtoggle" id="qToggle" type="button" title="הסתר שאלות" aria-label="הסתר/הצג שאלות">⟨</button>
      <span class="h">שאלות אפיון</span>
      <span class="prog" id="prog"></span>
    </div>
    <div class="qbody" id="qbody"></div>
  </aside>
</main>

<div class="print-only" id="printArea"></div>

<script>
/* ============ Tools ============ */
const TOOLS = [
  { id:"spotlight", name:"זרקור נושאי", subtitle:"מערכת מעלה · רשות הצעירים, נגב גליל וחוסן לאומי",
    src:"https://app.powerbi.com/view?r=eyJrIjoiYWM5YzM5MGMtZGRlZi00NGNlLWEwYWMtMTZkMmVhYTRlMzU2IiwidCI6ImZjZGQyYjRlLWQ3ZGQtNGI2ZS05NzhlLWEwN2FjMjQwYjcyZSIsImMiOjl9" },
  { id:"matrix", name:"מטריצת מדדים", subtitle:"דשבורד שביעות רצון · עיריית ירושלים",
    src:"https://app.powerbi.com/view?r=eyJrIjoiMWI0MDE5MTItZjdlYi00OGI3LWI3ODYtNjAyYzQ1NmM4YTNjIiwidCI6ImIzYzdlZDM0LWQxZjAtNDg5Zi05YzllLWE0YmNlYTk0YmJlNCIsImMiOjl9&pageName=ReportSectionc1a98ab090c0a85426f5" },
  { id:"drill", name:"תחקור מדד", subtitle:"דשבורד מדדי השפעה · מינהלת תקומה",
    src:"https://app.powerbi.com/view?r=eyJrIjoiMzMwNzJjNDYtYTdkNi00MWQzLTg3NzEtNzU4NzY0MGUyNmJiIiwidCI6IjczYWY5NzQ1LTFlMWUtNGFkNy05ZTIzLWVhMWYyMzYwMmQ2ZCIsImMiOjl9" },
  { id:"authority", name:"דוח רשות מקומית", subtitle:"מערכת SEMI מוביליות חברתית · הג'וינט",
    src:"https://app.powerbi.com/view?r=eyJrIjoiZjgzMWE3YTgtNDdmZC00MjQ0LTk5NWEtZTJlMzk1YzcwMGE5IiwidCI6ImIzYzdlZDM0LWQxZjAtNDg5Zi05YzllLWE0YmNlYTk0YmJlNCIsImMiOjl9&pageName=ReportSection0bd0c2d5b7885b30dc82" },
  { id:"explorer", name:"תחקור דינאמי", subtitle:"Data Explorer · מערכת מתושלח, שנתון זקנה, ברוקדייל",
    src:"https://app.powerbi.com/view?r=eyJrIjoiNWY1ZDJmYzYtNjY1ZS00NDNkLWEzODEtZWQwZjNlZTNhNzEwIiwidCI6ImIzYzdlZDM0LWQxZjAtNDg5Zi05YzllLWE0YmNlYTk0YmJlNCIsImMiOjl9&pageName=ReportSection783a92444b9df7b24c6d" },
  { id:"aichat", name:"AI Chat", subtitle:"תמרור פוליטוגרפיה · אוניברסיטת רייכמן (בטא)",
    src:"https://orange-stone-08c866c0f.1.azurestaticapps.net/full.html",
    creds:{ user:"demo", pass:"Tamrur2026!",
      note:"לאחר הכניסה בחרו «USER AGENT» בתפריט הניווט (לא DEBUG AGENT)" } }
];

/* ============ Questions ============ */
const QUESTIONS = [
  { id:"level", type:"single", label:"באיזו רמה המערכת מבנה את הלמידה שלי?",
    hint:"בחירה אחת",
    options:["רמה גבוהה","רמה בינונית","רמה נמוכה"] },
  { id:"how", type:"multi", label:"מהי שיטת היחסיות / השוואה של הלמידה במערכת?",
    hint:"אפשר לבחור יותר מאחד", other:true,
    options:["השוואה בין רשויות","השוואה של רשות ביחס לעצמה במגמת זמן","השוואה לנקודות השוואה גנריות (סוציו' פריפריאלי וכו')","השוואה לקבוצת רשויות דומות","השוואה לקבוצת רשויות דומות מותאמת אישית","השוואה ליעדים"] },
  { id:"stage", type:"multi", label:"באיזה שלב בציר העבודה, ניתוח כזה עוזר?",
    hint:"אפשר לבחור יותר משלב אחד",
    options:["טרום אסטרטגיה","תכנון אסטרטגיה","בניית תכנית העבודה","מימוש תכנית העבודה"] },
  { id:"client", type:"multi", label:"לאיזה לקוח מיועד?",
    hint:"אפשר לבחור יותר מאחד", other:true,
    options:["אגף אסטרטגיה","אגף מחקר","גורמי מטה","אנשי שטח","ציבור רחב"] },
  { id:"action", type:"multi", label:"מה אני עושה עם זה?",
    hint:"אפשר לבחור יותר מאחד", other:true,
    options:["קיום שיח עם גורמים ממונים / שותפים","תעדוף משאבים (תקציב, כ\"א, קשב ניהולי)","מעקב מול תכנון","בירור לעומק של סוגיה שלא קבלתי עליה תשובה במערכת","מענה לשאלה ספציפית אד-הוק שעלתה בשגרת העבודה","הבנה של תופעה"] }
];

/* ============ State ============ */
const STORAGE_KEY = "kyd_analytics_workshop_v2";
let state = load();
let current = TOOLS[0].id;

function load(){
  try{ const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); if(s) return s; }catch(e){}
  const fresh = { answers:{} };
  TOOLS.forEach(t=>{ fresh.answers[t.id] = {}; });
  return fresh;
}
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

function ans(toolId){
  if(!state.answers[toolId]) state.answers[toolId] = {};
  return state.answers[toolId];
}

/* ============ Render: tool nav ============ */
const toolNav = document.getElementById("toolNav");
function isToolAnswered(toolId){
  const a = ans(toolId);
  return QUESTIONS.some(q=>{
    const v = a[q.id];
    if(!v) return false;
    if(q.type==="text") return (v||"").trim()!=="";
    return (v.sel && v.sel.length) || (v.other && v.other.trim()!=="") || (v.note && v.note.trim()!=="");
  });
}
function renderNav(){
  toolNav.innerHTML="";
  TOOLS.forEach(t=>{
    const b=document.createElement("button");
    b.className="tool-btn"+(t.id===current?" active":"")+(isToolAnswered(t.id)?" answered":"");
    b.innerHTML='<span class="dot">✓</span><span class="nm">'+t.name+'</span><span class="sb">'+t.subtitle+'</span>'+
      (t.creds?'<span class="cr">🔑 '+t.creds.user+' / '+t.creds.pass+'</span>'+
        (t.creds.note?'<span class="crn">↪ בחרו USER AGENT</span>':''):'');
    b.onclick=()=>{ current=t.id; selectTool(); };
    toolNav.appendChild(b);
  });
}

/* ============ Render: dashboard ============ */
const dashFrame=document.getElementById("dashFrame");
const dashFallback=document.getElementById("dashFallback");
const dashTitle=document.getElementById("dashTitle");
const dashSrc=document.getElementById("dashSrc");
const dashCreds=document.getElementById("dashCreds");
function loadDash(t){
  dashTitle.textContent=t.name;
  dashSrc.textContent=t.subtitle;
  if(t.creds){
    dashCreds.innerHTML='🔑 <b>פרטי כניסה —</b> שם משתמש: <code>'+t.creds.user+'</code> · סיסמה: <code>'+t.creds.pass+'</code>'+
      (t.creds.note?' <span class="crnote">↪ '+t.creds.note+'</span>':'');
    dashCreds.classList.add("show");
  } else {
    dashCreds.classList.remove("show"); dashCreds.innerHTML="";
  }
  dashFallback.style.display="none";
  // NOTE: intentionally NO allowfullscreen -> the Fullscreen API is denied for the embed.
  dashFrame.src=t.src;
}

/* ============ Render: questions ============ */
const qbody=document.getElementById("qbody");
const prog=document.getElementById("prog");

function renderQuestions(){
  const a=ans(current);
  qbody.innerHTML="";
  QUESTIONS.forEach(q=>{
    const wrap=document.createElement("div"); wrap.className="q";
    const lab=document.createElement("div"); lab.className="ql"; lab.textContent=q.label; wrap.appendChild(lab);
    if(q.hint){ const h=document.createElement("div"); h.className="qhint"; h.textContent=q.hint; wrap.appendChild(h); }

    if(q.type==="text"){
      const ta=document.createElement("textarea");
      ta.value=a[q.id]||"";
      ta.placeholder="כתוב/י כאן…";
      ta.oninput=()=>{ a[q.id]=ta.value; save(); renderNav(); updateProg(); };
      wrap.appendChild(ta);
    } else {
      if(!a[q.id]) a[q.id]={sel:[],other:"",note:""};
      const cur=a[q.id];
      const chips=document.createElement("div"); chips.className="chips";
      q.options.forEach(opt=>{
        const c=document.createElement("button");
        c.type="button"; c.className="chip"+(cur.sel.includes(opt)?" on":"");
        c.textContent=opt;
        c.onclick=()=>{
          if(q.type==="single"){
            const already=cur.sel.includes(opt);
            cur.sel=already?[]:[opt];
            chips.querySelectorAll(".chip").forEach(el=>el.classList.remove("on"));
            if(!already) c.classList.add("on");
          } else {
            const i=cur.sel.indexOf(opt);
            if(i>=0) cur.sel.splice(i,1); else cur.sel.push(opt);
            c.classList.toggle("on");
          }
          save(); renderNav(); updateProg();
        };
        chips.appendChild(c);
      });
      // "other" chip
      let otherInput=null;
      if(q.other){
        const oc=document.createElement("button");
        oc.type="button"; oc.className="chip"+((cur.other&&cur.other.trim()!=="")?" on":"");
        oc.textContent="אחר";
        otherInput=document.createElement("input");
        otherInput.type="text"; otherInput.className="other-in"+((cur.other&&cur.other.trim()!=="")?" show":"");
        otherInput.placeholder="פרט/י…"; otherInput.value=cur.other||"";
        oc.onclick=()=>{
          const showing=otherInput.classList.toggle("show");
          oc.classList.toggle("on", showing || (otherInput.value.trim()!==""));
          if(showing) otherInput.focus(); else { cur.other=""; otherInput.value=""; }
          save(); renderNav(); updateProg();
        };
        otherInput.oninput=()=>{ cur.other=otherInput.value; oc.classList.toggle("on", otherInput.value.trim()!==""); save(); renderNav(); updateProg(); };
        chips.appendChild(oc);
      }
      wrap.appendChild(chips);
      if(otherInput) wrap.appendChild(otherInput);

      if(q.freeNote){
        const note=document.createElement("textarea");
        note.value=cur.note||""; note.placeholder="פירוט נוסף (לא חובה)…";
        note.style.minHeight="44px";
        note.oninput=()=>{ cur.note=note.value; save(); renderNav(); updateProg(); };
        wrap.appendChild(note);
      }
    }
    qbody.appendChild(wrap);
  });
  updateProg();
}

function qAnswered(q,a){
  const v=a[q.id]; if(!v) return false;
  if(q.type==="text") return (v||"").trim()!=="";
  return (v.sel&&v.sel.length)||(v.other&&v.other.trim()!=="")||(v.note&&v.note.trim()!=="");
}
function updateProg(){
  const a=ans(current);
  const n=QUESTIONS.filter(q=>qAnswered(q,a)).length;
  prog.textContent="נענו "+n+"/"+QUESTIONS.length;
}

function selectTool(){
  const t=TOOLS.find(x=>x.id===current);
  loadDash(t);
  renderNav();
  renderQuestions();
}

/* ============ PDF (print) ============ */
function fmtAnswer(q,a){
  const v=a[q.id];
  if(!v) return "";
  if(q.type==="text") return (v||"").trim();
  const parts=[];
  if(v.sel&&v.sel.length) parts.push.apply(parts, v.sel);
  if(v.other&&v.other.trim()!=="") parts.push("אחר: "+v.other.trim());
  let s=parts.join(" · ");
  if(v.note&&v.note.trim()!=="") s+= (s?" — ":"")+"פירוט: "+v.note.trim();
  return s;
}
function buildPrint(){
  const area=document.getElementById("printArea");
  const now=new Date().toLocaleDateString("he-IL");
  const logoMark='<span style="display:inline-flex;align-items:center;gap:8px;">'+
    '<svg width="28" height="28" viewBox="0 0 38 38" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="17.5" height="17.5" rx="3" fill="#00D4B4"></rect><rect x="20.5" y="0" width="17.5" height="11.4" rx="3" fill="#00D4B4" opacity="0.5"></rect><rect x="0" y="20.5" width="17.5" height="17.5" rx="3" fill="#00D4B4" opacity="0.35"></rect><rect x="20.5" y="20.5" width="17.5" height="17.5" rx="3" fill="#7C3AED"></rect></svg>'+
    '<span style="font-family:\'Space Grotesk\',sans-serif;font-weight:700;font-size:16px;letter-spacing:1.2px;color:#1A1A2E;">KNOW YOUR DATA</span></span>';
  let html='<div class="p-cover"><div class="p-logo">'+logoMark+'</div>'+
    '<h1>מדאטה להחלטה — סיכום אפיון מסכים אנליטיים</h1>'+
    '<div class="meta">תאריך: '+now+'</div></div>';
  TOOLS.forEach(t=>{
    const a=ans(t.id);
    html+='<div class="p-tool"><h2>'+t.name+'</h2><div class="p-src">'+t.subtitle+'</div>';
    QUESTIONS.forEach(q=>{
      const val=fmtAnswer(q,a);
      html+='<div class="p-qa"><span class="pq">'+q.label+'</span> <span class="pa'+(val?"":" empty")+'">'+(val||"לא נענה")+'</span></div>';
    });
    html+='</div>';
  });
  area.innerHTML=html;
}

/* ============ Events ============ */
/* collapse / expand questions panel (default: open) */
const qpanelEl=document.querySelector(".qpanel");
const qToggle=document.getElementById("qToggle");
function applyCollapsed(){
  const c=!!state.qCollapsed;
  qpanelEl.classList.toggle("collapsed", c);
  qToggle.textContent = c ? "⟩" : "⟨";
  qToggle.title = c ? "הצג שאלות" : "הסתר שאלות";
}
qpanelEl.querySelector(".qhead").addEventListener("click",()=>{
  state.qCollapsed=!state.qCollapsed; save(); applyCollapsed();
});
applyCollapsed();

document.getElementById("exportBtn").onclick=()=>{ buildPrint(); window.print(); };
document.getElementById("resetBtn").onclick=()=>{
  if(confirm("לאפס את כל התשובות? פעולה זו אינה הפיכה.")){
    state={answers:{}};
    TOOLS.forEach(t=>state.answers[t.id]={});
    save(); selectTool();
  }
};

/* init */
selectTool();
</script>
</body>
</html>
